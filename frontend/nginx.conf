# Frontend container nginx (CLAUDE.md §6.18/§6.19).
# Serves the built SPA and reverse-proxies /api to the backend over the private
# compose network. Security headers are set here; hardened in Step 12.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (baseline; CSP tightened in Step 12).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # API → backend (same-origin; keeps tokens off third parties).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming for /api/v1/query/stream.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
