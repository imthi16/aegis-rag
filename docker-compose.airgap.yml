# Aegis RAG — air-gap overlay (CLAUDE.md §6.19, finalized in Step 12).
#
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up
#
# Proves ZERO EGRESS (Golden Rule 1): no published ports except the nginx
# frontend, an `internal` backplane network with no route to the host/internet,
# and empty DNS so name resolution to external hosts fails closed.
#
# Step 1 ships a minimal, valid overlay; Step 12 hardens it (security headers,
# read-only rootfs, dropped capabilities, resource limits).

services:
  postgres:
    ports: !reset []
    dns: []
    networks:
      - aegis_internal

  ollama:
    ports: !reset []
    dns: []
    networks:
      - aegis_internal

  backend:
    ports: !reset []
    dns: []
    networks:
      - aegis_internal

  frontend:
    # The only service exposed to operators.
    ports:
      - "8080:80"
    dns: []
    networks:
      - aegis_internal

networks:
  aegis_internal:
    driver: bridge
    internal: true
