# Alembic configuration (CLAUDE.md §2, §6.2).
# The actual database URL is injected at runtime by alembic/env.py from
# app.core.config.get_settings() — never hardcode secrets here. The baseline
# migration is authored in Step 2.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py (left blank on purpose).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
