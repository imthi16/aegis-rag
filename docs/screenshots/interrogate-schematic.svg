<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Aegis RAG — Interrogate screen (schematic)</title>
  <desc id="desc">Schematic of the chat interface: command rail on the left, conversation in the centre with a trust-sealed answer and citation chips, evidence rail on the right showing the faithfulness gauge, CRAG document grades, and retrieved spans.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .eyebrow { font-size: 9px; letter-spacing: 2px; fill: #5C6B82; }
      .fg { fill: #E8EEF6; }
      .dim { fill: #8B9AB0; }
      .faint { fill: #5C6B82; }
      .beacon { fill: #39D6C4; }
    </style>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C121C"/>
      <stop offset="100%" stop-color="#0A0E15"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131D2B"/>
      <stop offset="100%" stop-color="#0D1420"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" fill="#0A0E15"/>

  <!-- ─────────────── Command rail ─────────────── -->
  <rect x="0" y="0" width="212" height="660" fill="url(#rail)"/>
  <line x1="212" y1="0" x2="212" y2="660" stroke="#8FA6C4" stroke-opacity="0.12"/>

  <!-- Seal mark -->
  <path d="M30 20 L44 27 L44 41 L30 48 L16 41 L16 27 Z" fill="none" stroke="#39D6C4" stroke-width="1.5"/>
  <path d="M30 28 L37 31.5 L37 38 L30 41.5 L23 38 L23 31.5 Z" fill="#39D6C4" fill-opacity="0.35"/>
  <text x="58" y="30" class="mono fg" font-size="13" font-weight="600" letter-spacing="3.5">AEGIS</text>
  <text x="58" y="44" class="mono eyebrow">SOVEREIGN RAG</text>
  <line x1="20" y1="66" x2="192" y2="66" stroke="#8FA6C4" stroke-opacity="0.12"/>

  <!-- Nav — active item is a raised plate with a beacon indicator -->
  <rect x="12" y="84" width="188" height="34" rx="6" fill="#141E2C"/>
  <rect x="12" y="93" width="3" height="16" rx="1.5" fill="#39D6C4"/>
  <rect x="28" y="95" width="12" height="12" rx="2" fill="none" stroke="#39D6C4" stroke-width="1.4"/>
  <text x="50" y="105" class="sans fg" font-size="12" font-weight="500">Interrogate</text>
  <text x="186" y="105" class="mono faint" font-size="9" text-anchor="end">01</text>

  <rect x="28" y="131" width="12" height="12" rx="2" fill="none" stroke="#8B9AB0" stroke-width="1.4"/>
  <text x="50" y="141" class="sans dim" font-size="12">Corpus</text>
  <text x="186" y="141" class="mono faint" font-size="9" text-anchor="end">02</text>

  <rect x="28" y="167" width="12" height="12" rx="2" fill="none" stroke="#8B9AB0" stroke-width="1.4"/>
  <text x="50" y="177" class="sans dim" font-size="12">Ledger</text>
  <text x="186" y="177" class="mono faint" font-size="9" text-anchor="end">03</text>

  <rect x="28" y="203" width="12" height="12" rx="2" fill="none" stroke="#8B9AB0" stroke-width="1.4"/>
  <text x="50" y="213" class="sans dim" font-size="12">Evaluation</text>
  <text x="186" y="213" class="mono faint" font-size="9" text-anchor="end">04</text>

  <!-- Perimeter status well -->
  <rect x="12" y="540" width="188" height="50" rx="6" fill="#090D14" stroke="#8FA6C4" stroke-opacity="0.10"/>
  <circle cx="28" cy="561" r="4" fill="#35C08A"/>
  <text x="42" y="565" class="mono" font-size="9" letter-spacing="2" fill="#35C08A">AIR-GAPPED</text>
  <text x="20" y="580" class="mono faint" font-size="9">zero egress · on-premise</text>

  <!-- Operator identity -->
  <line x1="0" y1="606" x2="212" y2="606" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <rect x="14" y="620" width="26" height="26" rx="5" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.25"/>
  <text x="27" y="637" class="mono beacon" font-size="10" font-weight="600" text-anchor="middle">AN</text>
  <text x="50" y="632" class="sans fg" font-size="11">analyst</text>
  <text x="50" y="644" class="mono faint" font-size="8.5" letter-spacing="1">ANALYST · VIEWER</text>

  <!-- ─────────────── Conversation ─────────────── -->

  <!-- Operator question -->
  <rect x="520" y="36" width="320" height="34" rx="6" fill="#141E2C" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="536" y="57" class="sans fg" font-size="11.5">What controls satisfy HIPAA audit requirements?</text>

  <!-- Answer plate — the trust rail is the left edge -->
  <rect x="240" y="92" width="600" height="212" rx="9" fill="url(#plate)" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <path d="M240 101 a9 9 0 0 1 9 -9 h0 v212 h0 a9 9 0 0 1 -9 -9 Z" fill="#39D6C4"/>

  <!-- Trust seal -->
  <rect x="260" y="110" width="152" height="21" rx="4" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.30"/>
  <path d="M270 116 l3.5 3.5 l6 -6.5" fill="none" stroke="#39D6C4" stroke-width="1.6" stroke-linecap="round"/>
  <text x="288" y="125" class="mono beacon" font-size="9" letter-spacing="1.4">VERIFIED · GROUNDED</text>

  <!-- Answer body (represented as measure lines) -->
  <rect x="260" y="146" width="560" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.80"/>
  <rect x="260" y="162" width="540" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.72"/>
  <rect x="260" y="178" width="566" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.72"/>
  <rect x="260" y="194" width="392" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.62"/>
  <rect x="260" y="216" width="500" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.55"/>
  <rect x="260" y="232" width="300" height="7" rx="3.5" fill="#E8EEF6" fill-opacity="0.45"/>

  <!-- Citation chips -->
  <line x1="260" y1="256" x2="820" y2="256" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="260" y="280" class="mono eyebrow">SOURCES</text>
  <rect x="322" y="268" width="94" height="20" rx="4" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.30"/>
  <text x="332" y="282" class="mono beacon" font-size="9">[1] p.4 · §164</text>
  <rect x="424" y="268" width="94" height="20" rx="4" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.30"/>
  <text x="434" y="282" class="mono beacon" font-size="9">[2] p.9 · §312</text>
  <rect x="526" y="268" width="94" height="20" rx="4" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.30"/>
  <text x="536" y="282" class="mono beacon" font-size="9">[3] p.12 · A.7</text>

  <!-- Command bar -->
  <line x1="212" y1="586" x2="872" y2="586" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="240" y="620" class="mono beacon" font-size="13">›</text>
  <rect x="258" y="602" width="480" height="36" rx="6" fill="#090D14" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="272" y="625" class="mono faint" font-size="11">Query the corpus…</text>
  <rect x="750" y="602" width="90" height="36" rx="6" fill="#39D6C4"/>
  <text x="795" y="625" class="sans" font-size="12" font-weight="600" fill="#0A0E15" text-anchor="middle">Ask ⏎</text>

  <!-- ─────────────── Evidence rail ─────────────── -->
  <line x1="872" y1="0" x2="872" y2="660" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <rect x="872" y="0" width="328" height="660" fill="#0F1622" fill-opacity="0.40"/>
  <text x="896" y="42" class="mono eyebrow">// EVIDENCE</text>

  <!-- Faithfulness gauge -->
  <text x="896" y="72" class="mono eyebrow">FAITHFULNESS</text>
  <rect x="896" y="84" width="280" height="78" rx="6" fill="#090D14" stroke="#8FA6C4" stroke-opacity="0.10"/>
  <text x="912" y="118" class="mono fg" font-size="24" font-weight="600">0.86</text>
  <rect x="1074" y="100" width="86" height="20" rx="4" fill="#39D6C4" fill-opacity="0.10" stroke="#39D6C4" stroke-opacity="0.30"/>
  <text x="1117" y="114" class="mono beacon" font-size="9" letter-spacing="1" text-anchor="middle">VERIFIED</text>
  <rect x="912" y="130" width="248" height="7" rx="3.5" fill="#0A0E15"/>
  <rect x="912" y="130" width="213" height="7" rx="3.5" fill="#39D6C4"/>
  <rect x="1085" y="127" width="1.5" height="13" fill="#E8EEF6" fill-opacity="0.45"/>
  <text x="912" y="153" class="mono faint" font-size="8.5" letter-spacing="1">GATE ≥ 0.70</text>

  <!-- CRAG document grades -->
  <text x="896" y="196" class="mono eyebrow">DOCUMENT GRADES</text>
  <text x="1176" y="196" class="mono faint" font-size="9" text-anchor="end">4</text>

  <rect x="896" y="206" width="280" height="26" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.10"/>
  <rect x="906" y="213" width="12" height="12" rx="2.5" fill="#35C08A" fill-opacity="0.18"/>
  <path d="M909 219 l2 2 l4 -4.5" fill="none" stroke="#35C08A" stroke-width="1.4" stroke-linecap="round"/>
  <text x="926" y="223" class="mono dim" font-size="10">a3f91c04</text>
  <text x="1166" y="223" class="mono dim" font-size="10" text-anchor="end">0.94</text>

  <rect x="896" y="238" width="280" height="26" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.10"/>
  <rect x="906" y="245" width="12" height="12" rx="2.5" fill="#35C08A" fill-opacity="0.18"/>
  <path d="M909 251 l2 2 l4 -4.5" fill="none" stroke="#35C08A" stroke-width="1.4" stroke-linecap="round"/>
  <text x="926" y="255" class="mono dim" font-size="10">7b20de55</text>
  <text x="1166" y="255" class="mono dim" font-size="10" text-anchor="end">0.88</text>

  <rect x="896" y="270" width="280" height="26" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.10"/>
  <rect x="906" y="277" width="12" height="12" rx="2.5" fill="#8FA6C4" fill-opacity="0.10"/>
  <rect x="909" y="282.5" width="6" height="1.4" rx="0.7" fill="#5C6B82"/>
  <text x="926" y="287" class="mono faint" font-size="10">c118a0b9</text>
  <text x="1166" y="287" class="mono faint" font-size="10" text-anchor="end">0.31</text>

  <!-- Retrieved spans -->
  <text x="896" y="330" class="mono eyebrow">RETRIEVED SPANS</text>
  <text x="1176" y="330" class="mono faint" font-size="9" text-anchor="end">8</text>

  <rect x="896" y="342" width="280" height="62" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="908" y="360" class="mono faint" font-size="8.5">doc a3f91c04 · p4</text>
  <text x="1164" y="360" class="mono dim" font-size="8.5" text-anchor="end">0.713</text>
  <rect x="908" y="370" width="256" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.35"/>
  <rect x="908" y="381" width="240" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.28"/>
  <rect x="908" y="392" width="176" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.22"/>

  <rect x="896" y="412" width="280" height="62" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="908" y="430" class="mono faint" font-size="8.5">doc 7b20de55 · p9</text>
  <text x="1164" y="430" class="mono dim" font-size="8.5" text-anchor="end">0.664</text>
  <rect x="908" y="440" width="256" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.35"/>
  <rect x="908" y="451" width="228" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.28"/>
  <rect x="908" y="462" width="150" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.22"/>

  <rect x="896" y="482" width="280" height="62" rx="5" fill="#0A0E15" fill-opacity="0.55" stroke="#8FA6C4" stroke-opacity="0.12"/>
  <text x="908" y="500" class="mono faint" font-size="8.5">doc c118a0b9 · p12</text>
  <text x="1164" y="500" class="mono dim" font-size="8.5" text-anchor="end">0.591</text>
  <rect x="908" y="510" width="256" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.35"/>
  <rect x="908" y="521" width="210" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.28"/>
  <rect x="908" y="532" width="188" height="5" rx="2.5" fill="#8B9AB0" fill-opacity="0.22"/>

  <!-- Schematic marker — this is a diagram, not a capture -->
  <text x="896" y="624" class="mono faint" font-size="8.5" letter-spacing="1.5">SCHEMATIC · NOT A CAPTURE</text>
  <text x="896" y="638" class="mono" font-size="8.5" fill="#3E4A5C">make screenshots → real captures</text>
</svg>
