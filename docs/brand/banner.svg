<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Aegis RAG — sovereign, air-gapped retrieval-augmented generation">
  <title>Aegis RAG — Sovereign RAG</title>

  <!--
    Built from the product's own tokens (frontend/tailwind.config.js), not a
    separate brand language: ink #0A0E15, verdigris beacon #39D6C4, monospace as
    the identity voice. No webfonts (the app ships none either), no filters or
    <style> — GitHub's SVG sanitizer strips those, and static art needs neither.
  -->
  <defs>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C121C"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#39D6C4" stop-opacity="0.10"/>
      <stop offset="0.62" stop-color="#39D6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA6C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FA6C4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="field">
      <rect x="0.5" y="0.5" width="1199" height="339" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#field)">
    <rect width="1200" height="340" fill="url(#seam)"/>
    <rect width="1200" height="340" fill="url(#beam)"/>
  </g>

  <!-- The seal: reused verbatim from components/layout/SovereignMark.tsx -->
  <g transform="translate(64 78) scale(1.9)" fill="none" stroke="#39D6C4" stroke-linejoin="round">
    <path d="M16 2.5 27.5 9v14L16 29.5 4.5 23V9L16 2.5Z" stroke-width="1.6" opacity="0.55"/>
    <path d="M16 7 23 11v10l-7 4-7-4V11l7-4Z" stroke-width="1.3" opacity="0.9"/>
    <rect x="12.4" y="13.6" width="4.2" height="6.6" rx="2.1" transform="rotate(-32 14.5 16.9)" stroke-width="1.4"/>
    <rect x="15.4" y="11.8" width="4.2" height="6.6" rx="2.1" transform="rotate(-32 17.5 15.1)" stroke-width="1.4"/>
  </g>

  <!-- Wordmark + eyebrow, matching the app's command rail exactly -->
  <text x="148" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="46" font-weight="600" letter-spacing="13" fill="#E8EEF6">AEGIS</text>
  <text x="151" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="2.6" fill="#5C6B82">SOVEREIGN RAG</text>

  <!--
    Perimeter status — the platform's whole promise, stated once. Widths are set
    from the metrics (10px mono ~6.0px/char + tracking), not eyeballed, so the
    label cannot spill past the pill.
  -->
  <g transform="translate(914 88)">
    <rect x="0" y="0" width="222" height="34" rx="6" fill="#0F1622" stroke="#35C08A" stroke-opacity="0.28"/>
    <circle cx="18" cy="17" r="3.4" fill="#35C08A"/>
    <text x="32" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10" letter-spacing="1.6" fill="#35C08A">AIR-GAPPED</text>
    <text x="112" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10" fill="#5C6B82" opacity="0.6">·</text>
    <text x="126" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10" letter-spacing="1.6" fill="#5C6B82">ZERO EGRESS</text>
  </g>

  <text x="64" y="196" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" fill="#E8EEF6">Citation-backed, faithfulness-graded answers over your private corpus.</text>
  <text x="64" y="224" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" fill="#8B9AB0">Access enforced at retrieval. Every action written to a tamper-evident ledger.</text>

  <!--
    Signature: the ledger as typographic spine. Each fragment's tail is the next
    one's head — the same prev_hash → entry_hash linkage the audit chain enforces,
    fading right because the chain is append-only and unbounded.
  -->
  <line x1="64" y1="268" x2="1136" y2="268" stroke="url(#spine)" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4">
    <text x="64" y="294" fill="#5C6B82" opacity="0.9">genesis</text>
    <text x="132" y="294" fill="#5C6B82" opacity="0.55">→</text>
    <text x="152" y="294" fill="#39D6C4" opacity="0.85">6064c2…675b</text>
    <text x="248" y="294" fill="#5C6B82" opacity="0.5">→</text>
    <text x="268" y="294" fill="#39D6C4" opacity="0.7">63cf64…386e</text>
    <text x="364" y="294" fill="#5C6B82" opacity="0.45">→</text>
    <text x="384" y="294" fill="#39D6C4" opacity="0.55">867cdb…8960</text>
    <text x="480" y="294" fill="#5C6B82" opacity="0.4">→</text>
    <text x="500" y="294" fill="#39D6C4" opacity="0.42">24adb6…bd30</text>
    <text x="596" y="294" fill="#5C6B82" opacity="0.32">→</text>
    <text x="616" y="294" fill="#39D6C4" opacity="0.3">a4d612…8602</text>
    <text x="712" y="294" fill="#5C6B82" opacity="0.24">→</text>
    <text x="732" y="294" fill="#39D6C4" opacity="0.2">ed99d5…4bb4</text>
    <text x="828" y="294" fill="#5C6B82" opacity="0.16">→</text>
    <text x="848" y="294" fill="#39D6C4" opacity="0.12">3b71af…c05d</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#8FA6C4" stroke-opacity="0.14"/>
</svg>
