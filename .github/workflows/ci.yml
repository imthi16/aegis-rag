name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Offline-by-env, even in CI, to catch any accidental hub/telemetry calls.
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_app -d aegis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aegis_app:ci_password@localhost:5432/aegis
      TEST_DATABASE_URL: postgresql+asyncpg://aegis_app:ci_password@localhost:5432/aegis
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy app

      - name: Alembic upgrade head (verify migration applies)
        run: alembic upgrade head

      - name: pytest
        run: pytest

  eval-gate:
    name: Eval gate (RAGAS + DeepEval, local models)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate runs against LOCAL Ollama + local embeddings only (Step 10).
      # Neutral until implemented; flip to required once a CI-local model is
      # provisioned in the runner.
      - name: Run CI eval gate
        run: python eval/ci_gate.py --suite both
